apply plugin: 'com.android.application'

android {
    namespace 'com.paylink.smsforwarder'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.paylink.smsforwarder"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// No external dependencies on purpose — everything here is plain
// Android SDK (org.json, HttpURLConnection, platform Notification APIs)
// so the project builds without needing to fetch any libraries.
